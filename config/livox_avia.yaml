# Livox Avia（内置 IMU，无相机）配置
#
# 用于《自动驾驶中的SLAM技术》配套数据 avia/outdoor_Mainbuilding_10hz_*.bag。
# 该数据只有 /livox/lidar + /livox/imu，因此只跑纯 LIO（visual.enable=false）。
# Avia 内置 IMU 加速度单位是 g，由 ImuProcessor 静止初始化时自动换算。
#
# 所有魔法数字集中在这里。代码里不留任何硬编码阈值 ——
# 换传感器只改这个文件，不改代码。

lidar_topic: "/livox/lidar"
imu_topic:   "/livox/imu"      # Avia 内置 IMU（BMI088）
image_topic: "/camera/image_raw"

max_iterations: 5              # iEKF 最大迭代次数
num_threads:    4

# ---------------------------------------------------------------------------
# IMU 噪声。
# 优先从 datasheet 取，但 datasheet 值通常偏乐观，建议乘 5~10 倍安全系数。
# 更严谨的做法是用 Allan 方差从静置数据（建议 2 小时以上）标定。
#
# Avia 内置 IMU（BMI088）。取 FAST-LIO avia.yaml 量级的经验值。
# ---------------------------------------------------------------------------
imu:
  acc_noise:      0.1          # m/s^2/sqrt(Hz)
  gyr_noise:      0.01         # rad/s/sqrt(Hz)
  acc_bias_noise: 0.001        # 随机游走
  gyr_bias_noise: 0.0001
  gravity_norm:   9.805        # 按当地纬度修正，北京约 9.801
  init_frame_num: 30           # 静止初始化帧数。开机必须保持静止约 1 秒

# ---------------------------------------------------------------------------
# LiDAR。
#
# depth_err / beam_err 是整个权重体系的物理起点 —— 观测噪声完全由它们推导，
# 不做任何手工调权重。填错了会系统性地影响精度，务必按 datasheet 填。
# Avia: 测距精度 2cm @20m，角精度 <0.05°（取 0.1° 留余量）。
# ---------------------------------------------------------------------------
lidar:
  depth_err:  0.02             # 沿光束测距误差 (m)
  beam_err:   0.1              # 角分辨率误差 (deg)

  blind_min:  1.0              # Avia 近距离（<1m）测距不可靠
  blind_max:  200.0            # 标称 190m @10% 反射率
  filter_size: 0.3             # 体素降采样边长。室内可降到 0.1，室外可放到 0.3

  # Livox 专有
  point_filter_num: 3          # 每 N 点取 1。Avia 10Hz 单帧约 2.4 万点
  use_livox_tag:    true       # 用 tag 字段剔除雨雾/拖点噪声（强烈建议开）

  # LiDAR-IMU 外参。用 Avia 内置 IMU 时是固定的出厂值。
  # 外接 IMU 必须用 LI-Init 或 Kalibr 标定后填入。
  ext_rot_li: [1, 0, 0,
               0, 1, 0,
               0, 0, 1]
  ext_pos_li: [0.04165, 0.02326, -0.0284]   # Avia 官方值（同 FAST-LIO avia.yaml）

# ---------------------------------------------------------------------------
# 体素地图
# ---------------------------------------------------------------------------
voxel:
  max_voxel_size:  1.0         # 根体素边长。室内 0.3~0.5，室外 0.5~1.0
  max_layer:       3           # 八叉树最大层数，最小体素 = 0.5/2^3 = 6.25cm
  max_points_num:  50          # 单体素最大点数，超过不再更新平面
  plane_threshold: 0.01        # 最小特征值阈值。越小对平面要求越严

  sigma_num:       3.0         # 残差卡方检验倍数。3σ 意味着约 99.7% 置信

  # 局部滑窗：内存有界的关键。全局地图交给后端关键帧管理。
  sliding_en:      true
  sliding_thresh:  8.0         # 移动多远触发一次滑窗
  half_map_size:   100         # 保留半径（体素数）→ 100*0.5 = 50m

# ---------------------------------------------------------------------------
# 视觉（直接法为主，特征点法为备）
#
# 先跑通纯 LIO 再开这个。enable: false 时整个视觉链路不参与，
# 系统退化成一个高质量的 LIO。
# ---------------------------------------------------------------------------
visual:
  enable: false                # ← 第一次跑建议关掉，先确认 LIO 精度

  patch_size:    8
  pyramid_level: 3
  grid_size:     40            # 特征分布网格边长（像素），保证均匀分布
  outlier_thresh: 300.0        # 光度残差外点阈值
  img_point_cov:  100.0        # 光度观测噪声

  estimate_exposure: true      # 逆曝光时间在线估计（应对自动曝光）
  estimate_td:       true      # 相机-IMU 时间偏移在线估计
  use_plane_normal:  true      # 用 LiDAR 法向量算精确单应（关掉则退回 SVO 的近似）

  hybrid_mode: true            # 直接法失效时自动切特征点法
  photometric_health_thresh: 3.0   # 残差超过历史中位数 N 倍即判定失效

  # 相机内参（必须用 Kalibr 等工具标定后填入）
  width:  1280
  height: 720
  fx: 908.3
  fy: 908.5
  cx: 641.2
  cy: 358.7
  k1: -0.0521
  k2:  0.0602
  p1:  0.0
  p2:  0.0

# ---------------------------------------------------------------------------
# 相机-IMU 外参与在线标定
# ---------------------------------------------------------------------------
extrinsic:
  # Kalibr 标定的初值
  ext_rot_ci: [ 0,  0,  1,
               -1,  0,  0,
                0, -1,  0]
  ext_pos_ci: [0.05, 0.0, 0.03]

  # 分阶段解锁：0=全程固定 1=运动充分后解锁旋转 2=旋转收敛后再解锁平移
  # 直接法的收敛域只有几个像素，外参差 1° 在 10m 处就是 17cm 的投影误差。
  # 初值不准时建议先设 0 跑纯 LIO，标好外参再开。
  online_calib_level: 1
  unlock_rot_after_sec: 10.0
  unlock_pos_after_sec: 60.0

# ---------------------------------------------------------------------------
# 关键帧
# ---------------------------------------------------------------------------
keyframe:
  dist_thresh:  1.0            # m
  angle_thresh: 0.2            # rad (约 11.5°)
  time_thresh:  2.0            # s —— 静止时的兜底。
                               # 没有这条，车停 30 秒会一个关键帧都不产生，
                               # 之后突然移动位姿图会出现断裂。
  cov_thresh:   1.0            # 协方差过大的帧不做关键帧
  loop_kf_stride: 3.0          # 每隔多远取一个进回环检索库（控制检索规模）

# ---------------------------------------------------------------------------
# 后端
# ---------------------------------------------------------------------------
backend:
  enable: true

  # 回环检测
  sc_dist_thresh:     0.35     # Scan Context 相似度阈值。越小越严格
  loop_min_time_diff: 30.0     # 秒。排除相邻帧假回环
  icp_fitness_thresh: 0.3      # ICP 匹配质量门槛
  icp_max_iter:       100
  dual_modal_verify:  false    # 激光+视觉双模态验证。
                               # 误回环是因子图的头号杀手，强烈建议开

  # GPS（可选）
  use_gps:         false
  gps_cov_thresh:  2.0         # GPS 自身噪声门槛
  pose_cov_thresh: 0.05        # 位姿不确定度超过此值才启用 GPS
  gps_min_stride:  5.0         # GPS 因子最小空间间隔
  use_gps_z:       false       # GNSS 垂直精度差，默认用激光的 z

  relocal_kf_num: 20           # 回环后前端重建局部地图用的关键帧数
